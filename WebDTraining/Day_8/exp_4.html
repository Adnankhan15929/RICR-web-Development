<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
      div {
        display: flex;
      }
      
  </style>
  <body>
    <div>
      <script>
        for (let j = 1; j < 11; j++) {
          for (let i = 1; i < 11; i++) {
            document.write(j * i + "<br>");
          }
          document.write("<hr>");
        }
      </script>
    </div>
    <hr />
    <div>
      <script>
        for (let j = 11; j < 21; j++) {
          for (let i = 1; i < 11; i++) {
            document.write(j * i + "<br>");
          }
          document.write("<hr>");
        }
      </script>
    </div>
  </body>
</html>
