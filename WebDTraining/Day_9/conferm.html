<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body{
        background-color: khaki;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
    }
    #h34{
        font-size: 50px;
    }

    #main{
        padding: 5px 39px;
        border: 1px solid #000;
        background-color: white;
        /* height: 600px;
        width: 25%; */
        border-radius: 20px;
        box-shadow: 3px 3px 15px black, -3px -3px 15px black;
    }
    input{
        font-size: x-large;
        padding: 5px 20px;
        margin:5px ;
        background-color: pink;
        border-radius: 10px;
    }
    input:focus{
        background-color: skyblue;
    }
    #btn{
        display: flex;
        justify-content: center;
        align-items: center;
        button{
            background-color:white;
            color: blue;
            border: 2px solid blue;
            border-radius: 50%;
            font-size:x-large;
            padding: 20px 10px;
            margin: 5px;
        }
    }
    .b{
        display: flex;
        justify-content: center;
        align-items: center;
        button{
            font-size:x-large;
            padding: 20px 25px;
            margin: 10px;
            background-color:green;
            color: white;
            border: 1px solid #000;
            border-radius: 50%;
        }
    }
    
  </style>
  <body>
    <!-- <h1 onmouseover="alert('welcome to the city of lakes')" onmouseout="alert('welcome to bhpl')">SISTEC</h1> -->

    <div id="main">
      <h1 id="h34">Calculator</h1>
      <input type="number" id="n1" />
      <br />
      <input type="number" id="n2" />

      <div id="btn">
        <button>ADD</button>
        <button>SUB</button><button>MUL</button><button>DIV</button>
      </div>
      <div id="num"> 
        <div class="b">
            <button>1</button>
            <button>2</button>
            <button>3</button>
        </div>
        <div class="b">
            <button>4</button><button>5</button><button>6</button>
        </div>
        <div class="b">
            <button>7</button><button>8</button><button>9</button>
        </div>
        <div class="b">
            <button>0</button>
        </div>
      </div>
    
      <h1>Result: <span id="result"></span></h1>
    </div>

    <script>
        function sum(add) {
        x = parseInt(document.getElementById("n1").value);
        y = parseInt(document.getElementById("n2").value);
        switch (add) {
          case "add":
            document.getElementById("result").value = x + y;
            document.getElementById("side").innerHTML = "You pressed OK!";
            alert("You calculate addition");
            playSound();
            break;
          case "sub":
            document.getElementById("result").value = x - y;
            alert("You calculate subtraction");
            break;
          case "mul":
            document.getElementById("result").value = x * y;
            alert("You calculate multiplication");
            break;
          case "div":
            document.getElementById("result").value = x / y;
            alert("You calculate Division");
            break;
        }
      }
    </script>
  </body>
</html>
